function endSort(crew){
  const st=sortState; if(st.done) return; st.done=true; clearInterval(timerId);
  while(st.i<S.cur.fish.length){ const f=S.cur.fish[st.i]; applySort(f, f.o==="T"?"out":"up"); st.i++; }
  const lg=st.log.filter(x=>!x.trout);
  const okF=lg.filter(x=>x.d==="f"&&x.sex==="F"&&!x.sick), okM=lg.filter(x=>x.d==="m"&&x.sex==="M"&&!x.sick);
  const pairs=Math.min(okF.length,okM.length);
  const res={pondF:st.pondF, pondM:st.pondM, iso:st.iso, rec:st.rec, pairs,
    keptW:okF.concat(okM).filter(x=>x.o==="W").length, keptH:okF.concat(okM).filter(x=>x.o==="H").length,
    upW:lg.filter(x=>x.d==="up"&&x.o==="W").length, upH:lg.filter(x=>x.d==="up"&&x.o==="H").length,
    killedW:lg.filter(x=>x.d==="carc"&&x.o==="W").length, score:st.score/S.cur.fish.length, crew:!!(crew||st.crew)};
  if(lg.some(x=>x.sick&&(x.d==="f"||x.d==="m"))) S.sickRisk=true;
  S.cur.sorted=res; S.task="spawn"; AU.sfx("done");
  const pct=Math.round(res.score*100);
  openModal(`<div class="card"><div class="head"><h2>Sorting done!</h2><span class="timer">${res.crew?"Crew helped":pct+"% good calls"}</span></div>
    <div class="facts">
      <div class="fact"><b>${pairs}</b><span>spawning pairs (you needed ${S.cur.needPairs})</span></div>
      <div class="fact"><b style="color:var(--wild)">${S.plan.mark?res.upW:"?"}</b><span>wild fish sent upstream</span></div>
      <div class="fact"><b style="color:var(--hatch)">${S.plan.mark?res.upH:"?"}</b><span>hatchery fish sent upstream</span></div>
      <div class="fact"><b>${res.iso}</b><span>fish to isolation</span></div>
    </div>
    ${pairs<S.cur.needPairs?`<p class="feedback meh">You have fewer pairs than you need, so you'll raise fewer young fish this year.</p>`:""}
    ${S.plan.mark&&res.killedW?`<p class="feedback bad">${res.killedW} wild fish went to the carcass bins. They won't spawn.</p>`:""}
    <p class="muted">Most of this year's run never reached your table: some were caught by fishers, and others swam upriver past the ladder${S.plan.weir?"":" (there's no weir yet)"}.</p>
    <div><button class="btn" id="ok">Back to the hatchery ▸</button></div></div>`);
  $("#ok").onclick=()=>{ closeModal(); refreshAll(); focus("#gotask"); };
  modalKey=null; focus("#ok");
}

// ================= Mini-game: spawning room =================
let spawnState=null;
function openSpawn(){ AU.setMood("spawn");
  const pairs=S.cur.sorted.pairs;
  if(!pairs){ S.cur.spawnQ=0.85; S.task="release";
    openModal(`<div class="card"><div class="head"><h2>Spawning room</h2></div><p class="say">No pairs in the ponds this year${S.plan.rel===0?" because you're not raising any young fish":""}. Nothing to spawn.</p><div><button class="btn" id="ok">Okay ▸</button></div></div>`);
    $("#ok").onclick=()=>{closeModal();refreshAll();}; focus("#ok"); return; }
  spawnState={pair:0,pairs:Math.min(3,pairs),stage:0,scores:[],cur:[],msg:null};
  renderSpawn();
}
function renderSpawn(){
  const sp=spawnState, stages=["Collect the eggs","Add the milt","Swirl gently"];
  const head=`<div class="head"><h2>Spawning room</h2><span class="timer">Pair ${sp.pair+1} of ${sp.pairs}</span></div>
    <div class="goals">${stages.map((s,i)=>`<span class="goal" style="${i===sp.stage?"outline:2px solid var(--gold)":""}">${i<sp.stage?"✓ ":""}${s}</span>`).join("")}</div>`;
  let body="";
  if(sp.stage===0) body=`<p class="say">Hold the button to pour the female's eggs into the bucket. Let go when the eggs reach the green band. Too little wastes eggs; too much overflows!</p>
    <div class="meter"><div class="band" style="bottom:62%;height:16%"></div><div class="fill" id="fill" style="height:0%"></div></div>
    <div style="text-align:center"><button class="btn" id="hold">Hold to pour</button> <span class="muted">or hold <kbd>Space</kbd></span></div>`;
  if(sp.stage===1) body=`<p class="say">Now the male's milt. Tap when the marker is in the green zone.</p>
    <div class="track"><div class="zone" style="left:42%;width:16%"></div><div class="mark" id="mk" style="left:0%"></div></div>
    <div style="text-align:center"><button class="btn" id="tap">Add milt!</button> <span class="muted">or <kbd>Space</kbd></span></div>`;
  if(sp.stage===2) body=`<p class="say">Swirl the bucket gently: left, right, left, right… six taps. Steady and smooth wins.</p>
    <div class="prog"><span id="sw" style="width:0%"></span></div>
    <div class="swirl"><button class="btn" id="swl">◀</button><button class="btn" id="swr">▶</button></div><p class="muted" style="text-align:center">or <kbd>←</kbd> <kbd>→</kbd></p>`;
  openModal(`<div class="card mg" role="dialog" aria-label="Spawning">${head}${body}<div class="feedback" aria-live="polite">${sp.msg||"Each pair is one female and one male. Pairing them one-to-one keeps more family lines in the next generation."}</div></div>`);
  if(sp.stage===0) bucketGame(); if(sp.stage===1) miltGame(); if(sp.stage===2) swirlGame();
}
function spawnNext(score,msg){
  AU.sfx(score>0.85?"good":"meh"); const sp=spawnState; sp.cur.push(score); sp.msg=msg; sp.stage++; modalKey=null;
  if(sp.stage>2){ const avg=sp.cur.reduce((a,b)=>a+b,0)/3; sp.scores.push(avg); sp.cur=[]; sp.stage=0; sp.pair++;
    sp.msg=(avg>0.85?"Perfect pair! ":avg>0.65?"Great pair! ":"Okay pair. ")+"The fertilized eggs go to the incubators.";
    if(sp.pair>=sp.pairs){ setTimeout(endSpawn,300); return; } }
  setTimeout(renderSpawn, 300);
}
function bucketGame(){
  let lvl=0, holding=false, done=false; const fill=$("#fill"), b=$("#hold");
  let lt=performance.now(); const tick=()=>{ if(done) return; const nw=performance.now(), dt=Math.min(0.1,(nw-lt)/1000); lt=nw; if(holding){ lvl=Math.min(100,lvl+dt*52); fill.style.height=lvl+"%"; if(lvl>=100){ release(); return; } } requestAnimationFrame(tick); };
  const release=()=>{ AU.pourStop(); if(done||lvl===0) { holding=false; return; } holding=false; done=true; document.removeEventListener("keyup",up);
    const d=Math.abs(lvl-70), sc=d<=8?1:Math.max(0.3,1-(d-8)/30);
    spawnNext(sc, d<=8?"Perfect amount of eggs!":lvl>70?"A little overflow. Some eggs were lost.":"Not all the eggs made it in. A bit more next time."); };
  const up=e=>{ if(e.key===" "){ e.preventDefault(); release(); } };
  b.onpointerdown=e=>{e.preventDefault();holding=true;AU.pourStart();}; b.onpointerup=release; b.onpointerleave=()=>{if(holding)release();};
  modalKey=e=>{ if(e.key===" "){ e.preventDefault(); if(!e.repeat){ holding=true; AU.pourStart(); } } };
  document.addEventListener("keyup",up);
  requestAnimationFrame(tick); b.focus();
}
function miltGame(){
  let pos=0, dir=1, done=false; const mk=$("#mk"), b=$("#tap");
  let lt=performance.now(); const tick=()=>{ if(done) return; const nw=performance.now(), dt=Math.min(0.1,(nw-lt)/1000); lt=nw; pos+=dir*dt*75; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;} mk.style.left=pos+"%"; requestAnimationFrame(tick); };
  const hit=()=>{ if(done) return; done=true; AU.sfx("drop"); const d=Math.abs(pos-50), sc=d<=8?1:Math.max(0.3,1-(d-8)/40);
    spawnNext(sc, d<=8?"Right on time!":"A little off. Fewer eggs fertilized."); };
  b.onclick=hit; modalKey=e=>{ if(e.key===" "){ e.preventDefault(); hit(); } }; requestAnimationFrame(tick); b.focus();
}
function swirlGame(){
  let n=0, expect="l", t0=null, misses=0; const bar=$("#sw");
  const press=s=>{ if(n>=6) return; if(!t0) t0=performance.now(); if(s!==expect){ misses++; return; } AU.sfx("swish"); n++; expect=s==="l"?"r":"l"; bar.style.width=(n/6*100)+"%";
    if(n>=6){ const secs=(performance.now()-t0)/1000, sc=clamp(1-misses*0.12-Math.max(0,secs-4)*0.1,0.3,1); spawnNext(sc, sc>0.85?"Smooth swirl!":"A bit bumpy, but it'll do."); } };
  $("#swl").onclick=()=>press("l"); $("#swr").onclick=()=>press("r");
  modalKey=e=>{ if(e.key==="ArrowLeft"){e.preventDefault();press("l");} if(e.key==="ArrowRight"){e.preventDefault();press("r");} };
  $("#swl").focus();
}
function endSpawn(){
  const sp=spawnState, avg=sp.scores.reduce((a,b)=>a+b,0)/sp.scores.length;
  S.cur.spawnQ=0.7+0.3*avg; S.cur.spawnAvg=avg; S.task="release"; modalKey=null;
  const extra=S.cur.sorted.pairs-sp.pairs;
  openModal(`<div class="card"><div class="head"><h2>${avg>0.85?"Perfect spawning!":avg>0.65?"Great spawning!":"Spawning done"}</h2><span class="timer">${Math.round(S.cur.spawnQ*100)}% of eggs fertilized</span></div>

const SEALION_SVG=`<svg viewBox="0 0 120 90" aria-hidden="true"><ellipse cx="60" cy="80" rx="52" ry="12" fill="#ffffff22"/><path d="M28 86 C26 52 40 30 62 26 C84 22 98 40 96 86 Z" fill="#4a3a30"/><path d="M40 86 C40 58 50 44 64 42 C80 40 86 56 84 86 Z" fill="#5a473b"/>
<ellipse cx="64" cy="30" rx="26" ry="20" fill="#5b4739"/><ellipse cx="80" cy="36" rx="14" ry="10" fill="#6d5747"/><ellipse cx="90" cy="33" rx="4" ry="3" fill="#1b1310"/>
<circle cx="62" cy="25" r="4.5" fill="#120c0a"/><circle cx="63.5" cy="23.5" r="1.4" fill="#fff"/><path d="M84 40 l18 -3 M84 42 l18 2 M83 44 l16 6" stroke="#d9cbb8" stroke-width="1.2" fill="none"/><ellipse cx="44" cy="22" rx="3" ry="5" fill="#3c2f27"/></svg>`;
let hazeState=null;
function openHaze(){ AU.setMood("sort"); hazeState={t0:performance.now(),dur:20000,holes:[null,null,null,null,null,null],shoo:0,miss:0,next:0,done:false};
  openModal(`<div class="card" role="dialog" aria-label="Haze the sea lions"><div class="head"><h2>Haze the sea lions</h2><span class="timer" id="htimer">20s</span></div>
    <p class="muted">Sea lions keep popping up at the mouth of the fish ladder. Tap each one (or press <kbd>1</kbd>–<kbd>6</kbd>) to blast the air horn before it grabs a salmon. Non-lethal only: noise and spray.</p>
    <div class="goals"><span class="goal">Shooed <b id="hshoo">0</b></span><span class="goal">Fish grabbed <b id="hmiss">0</b></span></div>
    <div class="creek" id="creek">${[0,1,2,3,4,5].map(i=>`<button class="hole" data-h="${i}" aria-label="Spot ${i+1}"><span class="ripple"></span><span class="sl">${SEALION_SVG}</span><kbd>${i+1}</kbd></button>`).join("")}</div>
    <div class="feedback" id="hfb" aria-live="polite">Get ready…</div></div>`);
  document.querySelectorAll(".hole").forEach(b=>b.onclick=()=>hazeHit(+b.dataset.h));
  modalKey=e=>{ const n=parseInt(e.key,10); if(n>=1&&n<=6){ e.preventDefault(); hazeHit(n-1); } };
  requestAnimationFrame(hazeTick); }
function hazeTick(now){ const h=hazeState; if(!h||h.done) return; const el=now-h.t0, left=Math.max(0,Math.ceil((h.dur-el)/1000)); const tm=$("#htimer"); if(tm) tm.textContent=left+"s";
  const upd=()=>{ const a=$("#hshoo"), b=$("#hmiss"); if(a) a.textContent=h.shoo; if(b) b.textContent=h.miss; };
  h.holes.forEach((o,i)=>{ if(o&&now>o.until){ h.holes[i]=null; h.miss++; AU.sfx("gulp"); setHole(i,false,"grab"); const fb=$("#hfb"); if(fb){ fb.textContent="Too slow! That one grabbed a salmon."; fb.className="feedback bad"; } upd(); } });
  if(el<h.dur-800 && now>h.next){ const free=h.holes.map((o,i)=>o?null:i).filter(x=>x!==null); if(free.length){ const i=free[Math.floor(Math.random()*free.length)]; const life=Math.max(750,1500-el/30);
      h.holes[i]={until:now+life}; setHole(i,true); if(Math.random()<0.35) AU.sfx("bark"); } h.next=now+Math.max(380,900-el/40)+Math.random()*300; }
  if(el>=h.dur && h.holes.every(o=>!o)) return endHaze();
  requestAnimationFrame(hazeTick); }
function setHole(i,up,cls){ const b=document.querySelector(`.hole[data-h="${i}"]`); if(!b) return; b.classList.toggle("up",up); b.classList.remove("grab","shoo"); if(cls){ b.classList.add(cls); setTimeout(()=>b.classList.remove(cls),450); } }
function hazeHit(i){ const h=hazeState; if(!h||h.done) return; if(h.holes[i]){ h.holes[i]=null; h.shoo++; AU.sfx("horn"); setHole(i,false,"shoo"); const fb=$("#hfb"); if(fb){ fb.textContent=["Shoo! It dove away.","Got it! Off it goes.","Nice! The salmon swim on."][h.shoo%3]; fb.className="feedback good"; } const a=$("#hshoo"); if(a) a.textContent=h.shoo; } else AU.sfx("click"); }
function endHaze(){ const h=hazeState; h.done=true; const tot=h.shoo+h.miss, sc=tot?h.shoo/tot:1; S.sl.haze=sc; S.sl.goneT=performance.now(); modalKey=null;
  openModal(`<div class="card"><div class="head"><h2>${sc>=0.8?"Sea lions moved along!":sc>=0.5?"Mostly cleared out":"They're still hungry"}</h2><span class="timer">${Math.round(sc*100)}% shooed</span></div>
    <p class="say">You shooed ${h.shoo} sea lion${h.shoo===1?"":"s"} and ${h.miss} got a fish. ${sc>=0.5?"Most of the run should make it up the ladder this year.":"Expect more losses at the ladder this year."} Hazing works for a while, but sea lions learn and come back. That's why some hatcheries install exclusion gates.</p>
    <div><button class="btn" id="ok">Back to the hatchery ▸</button></div></div>`);
  $("#ok").onclick=()=>{ closeModal(); if(S.task==="talk" && talksLeft()===0) S.task="sort"; refreshAll(); }; focus("#ok"); }

function chart(){
  const W=680,H=180,L=44,Rr=12,Tp=12,B=24, hs=S.hist;
  const max=Math.max(2500,...hs.map(h=>h.NOS+h.HOS),S.baseNOS*1.3)*1.05, bw=(W-L-Rr)/YEARS;

  const goal=S.baseNOS*1.25;
  g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--gold)" stroke-dasharray="4 4"/><text x="${W-Rr-4}" y="${y(goal)-5}" text-anchor="end" style="fill:var(--gold)">quest goal</text>`;
  hs.forEach((h,i)=>{const x=L+i*bw+bw*0.15,w=bw*0.7,k=h.plan.mark;
    g+=`<rect x="${x}" y="${y(h.NOS)}" width="${w}" height="${y(0)-y(h.NOS)}" fill="${k?"var(--wild)":"#6f8a87"}"/><rect x="${x}" y="${y(h.NOS+h.HOS)}" width="${w}" height="${y(h.NOS)-y(h.NOS+h.HOS)}" fill="${k?"var(--hatch)":"#6f8a87"}" opacity="${k?1:0.55}"/>`;});
  if(S.done){const p=hs.map((h,i)=>`${i?"L":"M"}${L+i*bw+bw/2},${Tp+(H-Tp-B)*(1-h.F)}`).join(" ");g+=`<path d="${p}" fill="none" stroke="var(--good)" stroke-width="2.5"/>`;}
  for(let i=0;i<YEARS;i+=2) g+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${START+i}</text>`;
  if(!hs.length) g+=`<text x="${W/2}" y="${H/2}" text-anchor="middle">Your first season will show up here.</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wild and hatchery spawners by year">${g}</svg>`;
}

  <footer>Based on Anderson et al. (2020), <i>A review of hatchery reform science in Washington State</i>, WDFW. Hatchery layout based on Whatcom Creek Hatchery; the characters are fictional and the fish numbers are simplified for teaching.<br><span class="madeby">Made by Michael Stocklin 2026</span></footer>`;
  const qs=Object.values(S.quiz), qOk=qs.filter(Boolean).length;
  const summary=`Hatchery Reform Simulator · class code ${S.seed} · ${S.name} (${CLASSES[S.cls].t}) · ${title} · quest goals ${n}/4 · wild run ${fmt(S.baseNOS)} to ${fmt(lastN)} · avg catch ${fmt(avgC)} · wild strength ${Math.round(F0*100)} to ${Math.round(S.F*100)} · seasons on target ${met}/${YEARS} · checkpoints ${qOk}/${qs.length}`;
  $("#copy").onclick=async()=>{ const b=$("#copy");
    try{ await navigator.clipboard.writeText(summary); b.textContent="Copied"; }
    catch(e){ const slot=$("#copyslot"); slot.innerHTML=`<textarea class="copyout" id="copytext" rows="3" aria-label="Your results"></textarea><p class="muted" style="font-size:13px">Select this text and copy it.</p>`; const t=$("#copytext"); t.value=summary; t.focus(); t.select(); } };
  setupBoard({name:S.name, cls:S.cls, title, goals:n, wild:Math.round(lastN), wildStart:Math.round(S.baseNOS), catch:Math.round(avgC), strength:Math.round(S.F*100), met, quiz:qOk, quizOf:qs.length});
  $("#again").onclick=()=>{ if(boardUnsub){boardUnsub();boardUnsub=null;} S=null;R=null;render();window.scrollTo(0,0);};
}
async function setupBoard(entry){
  const el=$("#board"); if(!el) return;
  const msg=t=>{ if($("#board")) $("#board").innerHTML=`<p class="muted" style="margin-top:8px;font-size:14.5px">${t}</p>`; };
  if(!window.claude || !window.claude.use){ msg("The class board works in the online version of this game. Use <b>Copy my results</b> and paste them wherever your teacher collects them."); return; }
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db){ msg("The class board isn't available here. You may need to sign in. Use <b>Copy my results</b> to share how you did."); return; }
  const uid=user?await user.id():null; let note="";
  if(uid && !S.posted){
    try{ await db.doc("scores/"+uid).set({...entry, code:S.seed, at:new Date().toISOString()}); S.posted=true; }
    catch(e){ note="Your game couldn't be added to the board because your access to this page is view-only. Use Copy my results instead."; }
  } else if(!uid){ note="Sign in to add your game to the board. You can still see everyone else's."; }
  if(boardUnsub) boardUnsub();
  boardUnsub=db.collection("scores").where("code","==",S.seed).onSnapshot(snap=>{
    const box=$("#board"); if(!box) return;
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.goals-a.goals)||(b.wild-a.wild)||(b.catch-a.catch));
    box.innerHTML="";
    if(note){ const p=document.createElement("p"); p.className="muted"; p.style.cssText="margin-top:8px;font-size:14px"; p.textContent=note; box.appendChild(p); }
    if(!rows.length){ const p=document.createElement("p"); p.className="muted"; p.style.marginTop="8px"; p.textContent="No games on the board for this class code yet."; box.appendChild(p); return; }
    const wrap=document.createElement("div"); wrap.className="tablewrap";
    const tb=document.createElement("table"); tb.className="board";
    tb.innerHTML="<thead><tr><th>#</th><th>Manager</th><th>Rating</th><th>Goals</th><th>Wild run</th><th>Avg catch</th><th>Strength</th><th>Checkpoints</th></tr></thead>";
    const body=document.createElement("tbody");
    rows.forEach((r,i)=>{ const tr=document.createElement("tr"); if(r.id===uid) tr.className="me";
      [i+1, r.name||"Player", r.title||"", `${r.goals}/4`, `${fmt(r.wildStart||0)} → ${fmt(r.wild||0)}`, fmt(r.catch||0), r.strength, `${r.quiz||0}/${r.quizOf||0}`].forEach(c=>{const td=document.createElement("td"); td.textContent=String(c); tr.appendChild(td);}); body.appendChild(tr); });
    tb.appendChild(body); wrap.appendChild(tb); box.appendChild(wrap);
    const p=document.createElement("p"); p.className="muted"; p.style.cssText="margin-top:6px;font-size:12.5px"; p.textContent="Each player's most recent game with this class code. Ranked by quest goals, then wild run, then catch."; box.appendChild(p);
  }, ()=>msg("The class board stopped updating. Reload the page to see the latest scores."));
}

// ================= Boot =================
function start(data){
  if(data&&data.S){ S=data.S; R=rng(S.seed+S.year*7919+(S.talked||[]).length); S.talk=null; S.sign=null;
    render(); if(S.result&&!S.done) showResult(); }
  else render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
try{ if(GFX!=="2d") makePortraits(); }catch(e){ console.warn(e); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
