<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hatchery Reform Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a console-style game screen. Glass HUD on top, the 3D hatchery as the hero, a dialogue bar under it, objectives at the side; mini-games open as full-screen cards. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#070d12; --panel:rgba(16,28,36,.72); --panel2:rgba(255,255,255,.06); --line:rgba(255,255,255,.12); --edge:rgba(140,220,255,.35);
  --ink:#eef4f6; --muted:#9db0b8; --accent:#7fe0ff;
  --wild:#5fd3bc; --hatch:#ff9a66; --gold:#ffcf5a; --bad:#ff7a73; --good:#82e39a;
  --pixel:"Saira Semi Condensed",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;
  background-image:radial-gradient(1200px 600px at 20% -10%,#123447 0,transparent 60%),radial-gradient(900px 500px at 90% 10%,#2a1d3b 0,transparent 60%)}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,.px{font-family:var(--pixel);font-weight:700;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:clamp(34px,5.5vw,60px);font-weight:700;letter-spacing:-.01em} h2{font-size:24px} h3{font-size:18px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.lbl{font-family:var(--pixel);font-size:12.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.muted{color:var(--muted)}
.btn{background:linear-gradient(180deg,#ffffff,#dfe9ee);color:#0b1419;border:0;border-radius:999px;padding:10px 20px;font-family:var(--pixel);font-weight:700;font-size:17px;letter-spacing:.02em;box-shadow:0 4px 18px rgba(127,224,255,.25)}
.btn:hover{box-shadow:0 4px 24px rgba(127,224,255,.5)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:rgba(255,255,255,.1);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.step{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* HUD */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.me{display:flex;gap:12px;align-items:center}
.me .who{display:flex;flex-direction:column;gap:3px;min-width:150px}
.xp{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.xp span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#c7a6ff)}
.meters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:1020px){.hud{grid-template-columns:minmax(0,1fr)}.meters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.meters{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.m{padding:6px 7px}.m .v{font-size:17px}.m .s{font-size:11px}.m .lbl{font-size:10.5px;letter-spacing:.08em}.me .portrait{width:52px;height:52px}}
.m{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.m .v{font-family:var(--pixel);font-size:23px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.m .s{font-size:12px;color:var(--muted);line-height:1.25}
.m.locked{opacity:.45}
.d.up{color:var(--good)} .d.dn{color:var(--bad)}

/* Main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.game{position:relative;border-radius:18px;overflow:hidden;background:#0b1a14;aspect-ratio:16/10;touch-action:manipulation;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px var(--line)}
@media (max-width:700px){.game{aspect-ratio:4/3.4}}
#gl{display:block;width:100%;height:100%;cursor:pointer}
#cv{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;background:#1d3a1e}
.tags-layer{position:absolute;inset:0;pointer-events:none}
.mapl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;font-family:var(--pixel);font-weight:600;font-size:clamp(10px,1.15vw,13px);line-height:1;background:rgba(8,16,22,.62);color:#f2f7f8;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 9px;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mapl:hover{border-color:var(--accent);color:var(--accent)}
.mapl.task{background:var(--gold);color:#1d1606;border-color:transparent;box-shadow:0 0 18px rgba(255,207,90,.7);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translate(-50%,-70%)}}
.hidetags .mapl:not(.task){display:none}
.seasontag{position:absolute;left:12px;bottom:12px;font-family:var(--pixel);font-weight:600;font-size:13px;letter-spacing:.06em;background:rgba(8,16,22,.6);border:1px solid rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;pointer-events:none;backdrop-filter:blur(6px)}
.gbtns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.gbtns button{font-family:var(--pixel);font-weight:600;font-size:12.5px;background:rgba(8,16,22,.6);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;backdrop-filter:blur(6px)}
@media (max-width:600px){.seasontag{top:10px;bottom:auto;font-size:12px}.gbtns button{font-size:11.5px;padding:3px 8px}}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(8,16,22,.8);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;pointer-events:none}

/* Talk panel */
.panel{min-height:140px}
.dlg{display:flex;flex-direction:column;gap:12px}
.speaker{display:flex;gap:14px;align-items:center}
.portrait{flex:none;width:76px;height:76px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2f5d6b,#0e1b22);border:2px solid var(--edge);box-shadow:0 0 16px rgba(127,224,255,.25)}
.portrait svg,.portrait img{width:100%;height:100%;display:block;object-fit:cover}
.speaker .name{font-family:var(--pixel);font-size:21px;font-weight:700;color:var(--gold)}
.speaker .role{font-size:13px;color:var(--muted)}
.say{font-size:17px;line-height:1.6;max-width:72ch}
.say b{color:var(--gold)} .say .w{color:var(--wild);font-weight:700} .say .h{color:var(--hatch);font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--accent);background:rgba(127,224,255,.08)}
.choice .t{font-weight:700;display:flex;gap:9px;align-items:baseline}
.choice .t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-1px);box-shadow:0 0 8px var(--accent)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.tag.p{color:var(--good);border-color:rgba(130,227,154,.4)} .tag.n{color:var(--bad);border-color:rgba(255,122,115,.4)} .tag.c{color:var(--gold);border-color:rgba(255,207,90,.4)} .tag.l{color:var(--muted)}
.hint{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.keys{font-size:13.5px;color:var(--muted)}
kbd{font-family:var(--pixel);font-size:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:0 6px}

/* Side */
.checklist ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.checklist li i{font-style:normal;width:18px;height:18px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;margin-top:2px}
.checklist li.done{color:var(--muted);text-decoration:line-through}
.checklist li.done i{background:var(--good);color:#0b1419;border-color:transparent}
.checklist li.now{color:var(--gold);font-weight:700}
.checklist li.now i{border-color:var(--gold);box-shadow:0 0 10px rgba(255,207,90,.6)}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:10px 0 0;font-size:14px}
.sheet dt{color:var(--muted)} .sheet dd{margin:0;font-weight:700} .sheet dd.lock{font-weight:400;color:#62757c}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.pip{width:16px;height:8px;border-radius:2px;background:rgba(255,255,255,.08)}
.pip.on{background:var(--gold);box-shadow:0 0 6px rgba(255,207,90,.5)}
.quest ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.quest li{display:flex;gap:8px}
.quest li i{font-style:normal;font-family:var(--pixel);flex:none;width:16px;color:var(--muted)}
.quest li.ok i{color:var(--good)}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.notes details{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px}
.notes summary{cursor:pointer;font-weight:700}
.notes details p{margin-top:6px}
.coming{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:13.5px}
.cbar,.obar{height:8px;background:rgba(255,255,255,.07);border-radius:4px;display:flex;overflow:hidden}
.cbar i,.obar i{display:block;height:100%}
.mono{font-variant-numeric:tabular-nums;text-align:right}

/* Modal mini-games */
.modal-on{position:fixed;inset:0;z-index:50;background:rgba(3,8,12,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:860px;background:rgba(14,26,34,.92);border:1px solid var(--edge);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(127,224,255,.12);padding:20px;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .head h2{font-size:30px;background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.timer{font-family:var(--pixel);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.table{position:relative;background:radial-gradient(ellipse at 50% 30%,#2a4a57,#0d1a20);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:170px;overflow:hidden}
.table canvas{width:min(100%,640px);height:auto;border-radius:10px}
#bigfish{image-rendering:pixelated;image-rendering:crisp-edges}
.fishview{position:relative;width:min(100%,640px);aspect-ratio:2/1}
.fishview canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;border-radius:10px}
.hintring{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 14px rgba(255,207,90,.8);pointer-events:none}
.hintring::after{content:"adipose fin?";position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-family:var(--pixel);font-weight:600;font-size:12px;color:var(--gold)}
.scanline{font-family:var(--pixel);font-weight:600;font-size:14px;letter-spacing:.05em;color:#bfffd0;background:rgba(0,40,20,.6);border:1px solid rgba(127,255,170,.4);border-radius:999px;padding:3px 12px;box-shadow:0 0 12px rgba(127,255,170,.25)}
.tip{font-size:13px;color:var(--ink);background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px;text-align:center}
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--pixel);font-size:46px;font-weight:700;color:var(--gold);text-shadow:0 0 24px currentColor,0 4px 0 rgba(0,0,0,.4);pointer-events:none;white-space:nowrap;opacity:0;font-style:italic}
@media (prefers-reduced-motion:no-preference){.pop{animation:popup .8s ease-out forwards}@keyframes popup{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}25%{transform:translate(-50%,-50%) scale(1.12);opacity:1}100%{transform:translate(-50%,-85%) scale(1);opacity:0}}}
.dests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:620px){.dests{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dest{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.dest:hover:not(:disabled){border-color:var(--accent);background:rgba(127,224,255,.08)}
.dest b{font-family:var(--pixel);font-size:17px}
.dest span{font-size:12.5px;color:var(--muted)}
.dest kbd{align-self:flex-start}
.goals{display:flex;gap:8px;flex-wrap:wrap}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.goal b{font-family:var(--pixel);font-size:17px}
.feedback{min-height:48px;background:rgba(0,0,0,.25);border-left:3px solid var(--muted);padding:8px 12px;font-size:15px;border-radius:6px}
.feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)} .feedback.meh{border-color:var(--gold)}
.meter{position:relative;height:200px;width:96px;border:2px solid rgba(255,255,255,.35);border-top:0;border-radius:0 0 22px 22px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.04));overflow:hidden;margin:0 auto;box-shadow:inset 0 -10px 30px rgba(0,0,0,.4)}
.meter .fill{position:absolute;left:0;right:0;bottom:0;background:radial-gradient(circle at 30% 30%,#ffd27a 0 18%,transparent 19%) 0 0/16px 16px,linear-gradient(180deg,#ffb347,#f08a24);box-shadow:0 0 18px rgba(255,170,60,.6)}
.meter .band{position:absolute;left:0;right:0;background:rgba(130,227,154,.18);border-top:2px dashed var(--good);border-bottom:2px dashed var(--good);z-index:1}
.track{position:relative;height:36px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:rgba(130,227,154,.3);box-shadow:0 0 16px rgba(130,227,154,.5)}
.track .mark{position:absolute;top:4px;bottom:4px;width:12px;margin-left:-6px;background:#fff;border-radius:6px;box-shadow:0 0 12px #fff}
#hold,.swirl .btn,#tap{user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.swirl{display:flex;gap:10px;justify-content:center}
.swirl .btn{min-width:110px;font-size:22px}
.prog{height:10px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent))}
.mg{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:620px){.methods{grid-template-columns:minmax(0,1fr)}}

/* Results */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.fact b{display:block;font-family:var(--pixel);font-size:23px}
.fact span{font-size:13px;color:var(--muted)}
.event{display:flex;gap:10px;align-items:flex-start;background:rgba(255,180,80,.08);border:1px solid rgba(255,180,80,.3);border-radius:12px;padding:9px 12px}
.event .k{font-family:var(--pixel);font-weight:700;color:var(--gold);flex:none}
.note{border:1px solid rgba(255,207,90,.45);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,rgba(255,207,90,.1),rgba(255,207,90,.02))}
.note .src{font-size:12.5px;color:var(--muted)}
.lvup{background:linear-gradient(135deg,#ffe08a,#ffb84d);color:#1d1606;border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 30px rgba(255,190,80,.35)}
.lvup h3{font-size:21px}
.origin{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.orows{display:flex;flex-direction:column;gap:5px}
.orow{display:grid;grid-template-columns:44px minmax(60px,1fr) 40px minmax(0,1.4fr);gap:8px;align-items:center;font-size:13.5px}
@media (max-width:560px){.orow{grid-template-columns:44px minmax(0,1fr) 40px}.orow .muted{grid-column:2/-1;margin-top:-4px}}
.chart{overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--pixel);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:3px}

/* Start & end */
.title{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:28px}
.title .tagline{font-size:18px;color:var(--muted);max-width:62ch}
.title h1{background:linear-gradient(90deg,#fff 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.classes{grid-template-columns:minmax(0,1fr)}}
.cls{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.cls[aria-pressed="true"]{border-color:var(--accent);background:rgba(127,224,255,.1);box-shadow:0 0 20px rgba(127,224,255,.15)}
.cls .portrait{width:72px;height:72px}
.cls div{display:flex;flex-direction:column;gap:4px}
.cls .perk{font-size:13px;color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px}
.field input{font:inherit;font-size:18px;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:280px}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.howto{grid-template-columns:minmax(0,1fr)}}
.howto div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14.5px}
.howto>div>b:first-child{font-family:var(--pixel);color:var(--accent);display:block;font-size:18px;margin-bottom:3px}
.endgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.board{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
.board th{font-family:var(--pixel);font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.board td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
.board tr.me td{background:rgba(127,224,255,.08)}
.tablewrap{overflow-x:auto}
.copyout{width:100%;font:inherit;font-size:13px;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
footer{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mapl.task{animation:none}}
/* T-wand */
.wandrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.wandrow .btn{font-size:15px;padding:7px 14px}
.scanline.idle{color:var(--muted);background:rgba(0,0,0,.35);border-color:var(--line);box-shadow:none}
.scanline.hit{color:#1d1606;background:var(--gold);border-color:transparent;box-shadow:0 0 18px rgba(255,207,90,.7)}
.scanline.miss{color:#bfffd0}
/* Sea lion hazing */
.creek{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px;border-radius:16px;background:linear-gradient(180deg,#245a6c,#173e4c 60%,#122f3a);border:1px solid var(--line);box-shadow:inset 0 8px 30px rgba(0,0,0,.35)}
.hole{position:relative;height:120px;border:0;border-radius:50% 50% 14px 14px/30% 30% 14px 14px;background:radial-gradient(ellipse at 50% 85%,rgba(255,255,255,.12),rgba(255,255,255,0) 60%);overflow:hidden;padding:0}
.hole kbd{position:absolute;left:8px;top:6px;opacity:.7}
.hole .ripple{position:absolute;left:15%;right:15%;bottom:10px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.hole .sl{position:absolute;left:50%;bottom:-100px;width:110px;transform:translateX(-50%);transition:bottom .16s ease-out}
.hole .sl svg{width:100%;height:auto;display:block}
.hole.up .sl{bottom:0}
.hole.up .ripple{border-color:rgba(255,255,255,.55)}
.hole.shoo{background:radial-gradient(ellipse at 50% 70%,rgba(127,224,255,.45),transparent 70%)}
.hole.grab{background:radial-gradient(ellipse at 50% 70%,rgba(255,122,115,.45),transparent 70%)}
@media (max-width:520px){.hole{height:96px}.hole .sl{width:84px}}
.hole kbd{top:auto!important;bottom:6px}
#gl[hidden],#cv[hidden]{display:none!important}
.fpui{position:absolute;inset:0;pointer-events:none;z-index:3}
.fpcross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1.5px rgba(0,0,0,.35);transition:transform .15s,background .15s}
.fpcross.hot{transform:scale(2);background:var(--gold)}
.fpprompt{position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);pointer-events:auto;font-family:var(--pixel);font-weight:600;font-size:15px;color:#fff;background:rgba(8,16,22,.7);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 14px 5px 5px;display:flex;gap:9px;align-items:center;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fpprompt[hidden]{display:none}
.fpprompt kbd{background:var(--gold);color:#1d1606;border:0;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;font-family:inherit}
.fphelp{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;font-family:var(--pixel);font-size:13px;line-height:1.5;color:#fff;background:rgba(8,16,22,.62);border-radius:12px;padding:7px 14px;white-space:nowrap}
.fphelp[hidden]{display:none}
.fphelp span{opacity:.75;font-size:12px}
.fpstick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(8,16,22,.25)}
.fpstick[hidden]{display:none}
.fpstick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.6)}
.game.fp #gl{cursor:crosshair;touch-action:none}
.game.fp .mapl:not(.task){display:none}
.game.fp .tagtoggle,.game.fp #tagtoggle{display:none}
@media (max-width:600px){.fphelp{white-space:normal;width:86%;font-size:12px}.fpprompt{font-size:13px}}
@media (max-width:700px){.game.fp{aspect-ratio:auto;height:min(64vh,560px)}}
.fphelp .tch{display:none}
@media (pointer:coarse){.fphelp .kb{display:none}.fphelp .tch{display:inline;opacity:1;font-size:13px}}
@media (max-width:600px){.game.fp .fphelp{top:42px}}
.guide .gsec{display:flex;flex-direction:column;gap:6px}
.guide .gsec h3{margin:0}
.guide .gck{display:inline-block;width:18px;font-style:normal;color:var(--good);font-weight:700}
.guide details[open]{border-color:var(--gold)}
.guide>*{flex-shrink:0}
.madeby{display:inline-block;margin-top:4px;font-weight:600}

.game.mode2d{aspect-ratio:3/2}

function upkeep(p, cls){
  let c = [0,1,2,3,4][SIZES.indexOf(p.rel)];
  if(p.rel>0){ let m=METHOD[p.method].cost; if(cls==="tech"&&(p.method==="volitional"||p.method==="acclim")) m=Math.max(0,m-1); c+=m; }
  if(p.mark) c+=1;
  c += p.weir===0.85?2:p.weir===0.5?1:0;
  if(p.monitor && cls!=="geneticist") c+=2;
  if(p.slGate) c+=1;
  if(p.rear==="nat"&&p.rel>0) c+=Math.max(1,Math.ceil(p.rel));
  if(p.amp) c+=1;
  return c;
}
const funding = st => 5 + Math.round(6*st.trust) + (st.orca>0?1:0);
const tgt = p => p.desig==="contrib"?{phos:TGT.phos,pni:0.50}:p.desig==="stab"?{phos:TGT.phos,pni:TGT.pni,none:true}:{phos:TGT.phos,pni:TGT.pni};

function events(rand, cls, sick){
  const ev=[]; let ocean=1, fresh=1, disease=1;
  const o=rand();
  if(o<0.15){ocean=0.55;ev.push({k:"heatwave",t:"Marine heatwave",d:"The ocean ran warm and food was scarce. Far fewer salmon survived at sea."});}
  else if(o<0.30){ocean=0.8;ev.push({k:"poorocean",t:"Poor ocean year",d:"A below-average year at sea for the fish coming home."});}
  else if(o<0.45){ocean=1.35;ev.push({k:"upwelling",t:"Cold, rich ocean",d:"Strong upwelling fed the fish. More came home than expected."});}
  const f=rand();
  if(f<0.10){fresh=0.7;ev.push({k:"flood",t:"Winter flood",d:"High water scoured the gravel and washed away many wild eggs."});}
  else if(f<0.20){fresh=0.75;ev.push({k:"drought",t:"Summer drought",d:"Low, warm water was hard on wild young salmon."});}
  const dz=(cls==="tech"?0.035:0.07)+(sick?0.2:0);
  if(rand() < dz){disease=0.6;ev.push({k:"disease",t:"Disease outbreak",d:"Sickness spread through the crowded rearing pond. 4 in 10 young fish died before release."+(sick?" A sick fish that wasn't isolated may have started it.":"")});}
  return {ocean,fresh,disease,ev};
}

function legacyStep(st){
  const p=st.plan, y=st.year, m=METHOD[p.method], fi=FISHERY[p.fishery];
  const NOR=st.retN[y], HOR=st.retH[y];
  const NOR2=NOR*(1-fi.n), HOR2=HOR*(1-fi.h);
  const B=p.rel*1e6/PER_ADULT, atHatch=HOR2*(1-m.stray);
  const share=(NOR2*0.12)/(NOR2*0.12+atHatch+1e-9);
  const NOB=Math.min(B*share,NOR2*0.33), HOB=Math.min(B-NOB,atHatch), brood=NOB+HOB;
  const HOS=Math.max(0,HOR2-HOB)*m.stray, NOS=Math.max(0,NOR2-NOB);
  const released=Math.min(p.rel*1e6,brood*PER_ADULT), eco=Math.max(0.5,1-released/1e6*m.eco);
  const Eff=(NOS+RRS*HOS)*st.F, a=4.2, Rw=(a*Eff/(1+a*Eff/K))*eco, H=released*m.sar;
  const calY=st.calBase+y; st.rels[calY]={m:released/1e6,method:p.method};
  for(let i=3;i<6;i++){st.retN[y+i]+=Rw*AGE[i]; st.retH[y+i]+=H*AGE[i]; const sh=st.srcH[y+i]; sh[calY]=(sh[calY]||0)+H*AGE[i];}
  st.hist.push({NOS,HOS,harvest:NOR*fi.n+HOR*fi.h,pHOS:HOS/(HOS+NOS),plan:{...p},year:y});
  st.year++;
}

// Season part 1: the run comes home, fishers fish, the weir and ladder bring fish in for sorting
function computeRun(){
  const p=S.plan, y=S.year, m=METHOD[p.method], fi=FISHERY[p.fishery];
  const E=events(R,S.cls,S.sickRisk); S.sickRisk=false;
  let NOR=S.retN[y]*E.ocean, HOR=S.retH[y]*E.ocean;
  let pred=0; if(S.sl&&S.sl.active){ pred=p.slGate?0.03:(S.sl.choice==="haze"?0.18*(1-0.85*(S.sl.haze||0)):0.18);
    const eaten=(NOR+HOR)*pred; E.ev.push({k:"sealion",t:"Sea lions at the ladder",d:p.slGate?`Sea lions showed up, but the exclusion gate kept them out of the ladder. They caught only about ${fmt(eaten)} salmon.`:`Sea lions ate about ${fmt(eaten)} salmon at the mouth of the ladder${S.sl.choice==="haze"?", fewer thanks to your hazing":""}.`}); NOR*=1-pred; HOR*=1-pred; }
  const catchN=NOR*fi.n, catchH=HOR*fi.h, NOR2=NOR-catchN, HOR2=HOR-catchH;
  const weirEff=p.weir;
  const capH=(1-m.stray)+m.stray*weirEff, capW=0.06+0.88*weirEff;
  const TH=HOR2*capH, TW=NOR2*capW;
  let nW=Math.round(SAMPLE*TW/(TW+TH+1e-9)); if(TW>40&&nW===0) nW=1; if(TH>40&&nW===SAMPLE) nW=SAMPLE-1;
  const nH=SAMPLE-nW, sW=nW?TW/nW:0, sH=nH?TH/nH:0;
  const fish=[];
  for(let i=0;i<SAMPLE;i++){
    const o=i<nW?"W":"H";
    const dit=o==="H"&&p.mark&&R()<0.18; fish.push({o, sex:R()<0.5?"F":"M", clipped:o==="H"&&p.mark&&!dit, dit, sick:R()<0.08, tag:o==="H"&&(dit||R()<0.3), seed:Math.floor(R()*1e6)});
  }
  for(let i=fish.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[fish[i],fish[j]]=[fish[j],fish[i]];}
  if(R()<0.75) fish.splice(Math.floor(R()*fish.length),0,{o:"T",sex:"F",clipped:false,sick:false,tag:false,seed:Math.floor(R()*1e6)});
  const B=p.rel*1e6/PER_ADULT, avg=(TW+TH)/SAMPLE;
  const needPairs = B>0 ? clamp(Math.round(B/(2*avg)),1,4) : 0;
  S.cur={E,NOR,HOR,catchN,catchH,harvest:catchN+catchH,NOR2,HOR2,TW,TH,UW:NOR2-TW,UH:HOR2-TH,sW,sH,fish,needPairs,B,avg};
}

// Season part 2: after sorting, spawning and release
function finishSeason(){

  const pHOS=HOS/(HOS+NOS+1e-9), PNI=(pNOB+pHOS)>0?pNOB/(pNOB+pHOS):1;
  const segregated = p.pnob===0 || !p.mark || brood===0;
  const rn=p.rear==="nat", tr=!!st.flags.transferNow, wat=st.flags.water||null;
  const loss=0.056*pHOS*(1-0.6*pNOB)*((st.F-0.3)/0.7)*(rn?0.85:1)*(p.late?1.05:1), gain=0.064*(1-st.F)*(1-pHOS);
  const F0v=st.F; st.F=clamp(st.F-loss+gain-(tr?0.03:0),0.3,1); if(tr) st.sickRisk=true;

  const rec={src:st.srcH[y],year:y,cal:START+y,NOR:c.NOR,HOR:c.HOR,catchN:c.catchN,catchH:c.catchH,harvest:c.harvest,brood,NOB,pNOB,NOS,HOS,pHOS,PNI,F:st.F,dF:st.F-F0v,eco,released,relM,segregated,meets,events:E.ev,plan:{...p},trust0:st.trust,

  for(let i=0;i<6;i++){st.retN[i]=1700;st.retH[i]=11500;}

function buildQueue(){
  const slChance = S.year===2 && !S.flags.slSeen ? 1 : (S.year>=1 ? 0.28 : 0);
  S.sl = R()<slChance ? {active:true, choice:null, haze:null} : {active:false}; if(S.sl.active) S.flags.slSeen=1;
  const cand = ENC.filter(e=>e.when(S)).map(e=>({e,p:e.prio(S)+R()*12-((S.seen[e.id]!==undefined && S.year-S.seen[e.id]<3)?35:0)}));
  cand.sort((a,b)=>b.p-a.p);
  const q=[], who=new Set();
  for(const c of cand){ if(q.length>=(S.year>=2?3:2)) break; if(who.has(c.e.who)) continue; q.push(c.e.id); who.add(c.e.who); }
  S.queue=q; S.talked=[];
}
const pendingFor = who => S.queue.find(id=>!S.talked.includes(id) && ENC.find(e=>e.id===id).who===who);
const talksLeft = () => S.queue.filter(id=>!S.talked.includes(id)).length;

function optionState(o){
  if(o.need){ const n=o.need(S); if(n) return n; }
  const p={...S.plan}; o.apply(p);
  if(upkeep(p,S.cls)>funding(S) && upkeep(p,S.cls)>upkeep(S.plan,S.cls)) return "Not enough funding";
  return null;
}

const GUIDE = [
 {h:"Why hatcheries exist", sub:"Report: Introduction and Benefits of hatcheries, pp. 10–26", e:[
  {k:"g_what", t:"What a hatchery does", x:"A hatchery spawns salmon by hand and raises the young in tanks, where far more eggs survive than in a river. Then it releases them to grow up at sea. Hatcheries in Washington, Oregon and Idaho began in the late 1800s. Today about 500 programs release roughly 325 million young fish every year."},
  {k:"g_goals", t:"Two main goals", x:"Almost every hatchery program has one of two goals: give people fish to catch (harvest), or help a struggling wild population (conservation). Of the 159 programs the state runs, 124 are for harvest and 35 are for conservation. A few also do research and teaching."},
  {k:"g_harvest", t:"Fishing depends on hatcheries", x:"Most salmon and steelhead fishing in Washington targets hatchery fish. The authors say most of these fisheries would not exist, at least at their current size, without hatcheries."},
  {k:"g_econ", t:"Money and jobs", x:"In 2006, non-treaty commercial salmon fishing in Washington supported about $21 million in income and 507 jobs. The authors roughly estimate $153 million a year for sport salmon and steelhead fishing. Hatcheries are rarely put through a full cost-benefit study, which the authors blame on a lack of political will, not on technical limits."},
  {k:"g_social", t:"What fishing means to people", x:"In 2011 about 330,000 people fished for salmon in Washington's rivers. Fishing gives people identity and enjoyment that is hard to price. People also value simply knowing wild salmon exist and will be there for their grandchildren. Hatcheries that put wild runs at risk can eat away at that value."},
  {k:"g_treaty", t:"Treaty rights", x:"In the mid-1800s, tribes signed treaties that kept their right to fish in their traditional places. Courts have upheld that right many times. In 1980 a federal judge ruled that hatchery fish count toward the tribes' share, partly because hatcheries had become the main way of making up for lost habitat. In 1905 the Supreme Court wrote that fishing was \"not much less necessary to the existence of the Indians than the atmosphere they breathed.\""},
  {k:"g_mitig", t:"Making up for dams and lost habitat", x:"Many hatcheries were built because dams blocked spawning grounds; the law required power companies to replace the lost fish. That is called mitigation. In Puget Sound, managers also see hatcheries as making up for habitat lost to cities and farms, though this goal is rarely written down."},
  {k:"g_cons", t:"Saving a population from extinction", x:"Hatcheries have rescued runs on the edge of extinction. Sockeye salmon in Redfish Lake, Idaho, and summer chum salmon in Hood Canal are examples. The authors conclude that hatcheries have \"proven successful at preventing population extinctions and preserving unique genetic lineages.\""},
  {k:"g_reintro", t:"Putting salmon back", x:"Hatchery fish are also used to restart runs where salmon had disappeared. The authors found only one clear case where the new run kept going for generations after releases stopped: summer chum in Chimacum Creek. On the Elwha River, moving hatchery coho upstream sped up their spread after two dams were removed."},
  {k:"g_3gen", t:"The three-generation test", x:"Real conservation success means more wild-born adults, not just more fish on the spawning grounds. That takes three generations: the hatchery releases young fish, they return and spawn in the river, and their wild-born offspring return. It only works if the river has room for more young fish. If the river is already full, the extra spawners add nothing."},
  {k:"g_supp", t:"Does adding hatchery spawners grow the wild run?", x:"Two small programs that used only wild parents did help: in Johnson Creek, Idaho, hatchery-spawned Chinook left 2.5 times more wild-born grand-offspring. But a study of 22 Snake River populations found an average gain of only about 3%, and an Idaho study found numbers fell back to where they started once releases stopped. The authors think this is because the original cause of decline, usually habitat, is rarely fixed."},
  {k:"g_eco", t:"Salmon feed the ecosystem", x:"Salmon carry ocean nutrients into rivers and forests, feeding bears, birds and young fish. Chinook are the favorite food of endangered Southern Resident orcas. Fish that return to a hatchery don't feed the river, so crews often carry carcasses out to streams. Plans to raise more hatchery fish for orcas assume the ocean has room for them and that orcas can reach them. Neither has been tested."},
  {k:"g_edu", t:"Research and classrooms", x:"Some hatcheries test new ways to spawn, raise and release fish. Others run \"salmon in the classroom\" programs. The authors add a caution: children may come away thinking people, not nature, make salmon."}
 ]},
 {h:"The risks", sub:"Report: Risks of hatcheries, pp. 27–51", e:[
  {k:"g_mixed", t:"Mixed-stock fishing", x:"Big hatchery runs swim alongside small wild runs, and a net or hook can't tell them apart. So fishing aimed at hatchery fish also kills wild fish, many of them from threatened populations. Managers have struggled with this for decades."},
  {k:"g_msflim", t:"Limits of keep-the-clipped-ones fishing", x:"Mark-selective fishing lets people keep clipped hatchery fish and release wild ones. It lowers the death rate of unmarked fish. But many fisheries are not selective, and some released fish die anyway. For unmarked Puget Sound Chinook, selective fisheries make up only a small part of total fishing deaths."},
  {k:"g_asym", t:"A lopsided trade", x:"In some rivers, hatchery fish outnumber wild spawners ten to one or more. Closing a fishery to save a few wild fish means giving up a much larger catch of hatchery fish. Big hatchery programs make that trade more lopsided, which adds pressure to keep fishing."},
  {k:"g_mask", t:"Masking", x:"When lots of hatchery fish spawn in a river, it's hard to tell how well the wild fish are really doing. That uncertainty carries into the fishing limits, which are based on how productive the wild population seems to be."},
  {k:"g_within", t:"Diversity inside a population", x:"Genetic variety helps a population adapt when conditions change. A hatchery greatly boosts the survival of a few families, so relatives become common and inbreeding gets more likely. Scientists track this with effective population size (Ne). In Hood River steelhead, though, inbreeding explained at most 4% of the lost fitness, and probably less than 1%."},
  {k:"g_among", t:"Diversity among populations", x:"Each river's salmon are tuned to their home. For much of the 1900s, hatcheries moved eggs and parent fish between rivers. Hatchery fish also stray into other rivers on their own. Both make populations more alike. A region with many different populations is steadier, like a mixed investment portfolio."},
  {k:"g_domes", t:"Domestication", x:"A hatchery is a different world from a river, so traits that help fish do well in a tank can spread even though they hurt in the wild. This is called domestication selection. Some of it can't be avoided, and almost all of it is unintended."},
  {k:"g_rrs", t:"Relative reproductive success", x:"Scientists use DNA family trees to count how many offspring hatchery-born and wild-born fish leave when both spawn in a river. Hatchery-born fish usually leave fewer. In one long steelhead study, the effect even carried over to their wild-born offspring. Proof that the cause is genetic is still rare: two studies found it and two did not."},
  {k:"g_epi", t:"Gene switches", x:"Hatchery rearing changes which genes are turned on, even after one generation. Part of this may come from epigenetics, chemical tags on DNA that are not changes to the DNA itself. Nobody yet knows how long such changes are passed down."},
  {k:"g_comp", t:"Competition in the river", x:"Released hatchery fish eat the same food and use the same space as wild fish. Hatchery fish are often bigger and pushier; wild fish know the territory and dodge predators better. The factor that matters most is how many hatchery fish are released compared with how many fish the habitat can support."},
  {k:"g_ocean", t:"Competition at sea", x:"The ocean has limits too. Wild Chinook and hatchery fish share estuaries and nearshore waters, which are scarce and damaged. Studies link poor Chinook survival to big numbers of pink salmon, and to chum salmon released by hatcheries in Japan. Washington's hatcheries probably matter most in Puget Sound, the Columbia River estuary and along the coast."},
  {k:"g_pred", t:"Predation", x:"Year-old hatchery smolts can eat smaller wild young salmon. Big releases also draw birds, bigger fish and mammals to one place, and releases have become more bunched together in time. On the other hand, a flood of hatchery fish might swamp predators and shield wild fish. Very little of this has been measured."},
  {k:"g_dis", t:"Disease", x:"Most hatchery diseases are caused by germs already found in the region, and they can pass between hatchery and wild fish in either direction. Crowded tanks multiply germs: in Oregon, test fish placed below hatcheries with outbreaks got sick, while test fish above did not. Crowding also stresses fish and weakens their defenses."},
  {k:"g_fac", t:"The buildings and pipes", x:"A hatchery changes the river around it. Weirs and water intakes can block or delay fish, push spawning downstream or injure fish that are handled. Taking water out leaves less in the stream. Water flowing back out changes temperature and nutrients. These effects are regulated, but hardly studied."},
  {k:"g_popstudy", t:"What whole-river studies show", x:"Several studies found wild fish did worse in years with more hatchery releases or more hatchery spawners. Others found no link, and one result was overturned when ocean conditions were added in. Hatchery changes and climate both shift slowly, so they are hard to tell apart. The clearest evidence came from a big change: after coho releases ended on one Oregon river, wild coho increased and spawned over a wider range of dates."}
 ]},
 {h:"Hatchery reform", sub:"Report: Hatchery reform, pp. 52–94", e:[
  {k:"g_hsrg", t:"What hatchery reform means", x:"Hatchery reform is the set of widespread changes meant to lower the risk hatcheries pose to wild fish while keeping fisheries going. It is closely tied to the Hatchery Scientific Review Group (HSRG). Washington adopted the group's ideas as policy in 2009."},
  {k:"g_metrics", t:"pHOS, pNOB and PNI", x:"pHOS is the share of river spawners that are hatchery-born. pNOB is the share of hatchery parents that are wild-born. PNI = pNOB ÷ (pNOB + pHOS). It estimates whether the river or the hatchery has more say over the population's genes. These numbers stand in for the real risk, which is much harder to measure."},
  {k:"g_intseg", t:"Integrated or segregated", x:"An integrated program treats hatchery and wild fish as one population and brings wild parents into the hatchery. A segregated program uses only hatchery parents and tries to keep its fish off the wild spawning grounds. Nearly all conservation programs (34 of 35) are integrated; only 47 of 124 harvest programs are."},
  {k:"g_desig", t:"Primary, Contributing, Stabilizing", x:"Recovery planners rank each wild population. Primary populations are the foundation of recovery and get the strictest targets. Contributing populations get looser ones. Stabilizing populations are held where they are and have no pHOS or PNI targets at all. Tribes, the state and federal agencies make these choices together."},
  {k:"g_targets", t:"Where the targets come from", x:"PNI of 0.5 is the line where the river and the hatchery have equal influence. To stay above it, pHOS should be under 0.30 for integrated programs, and under 0.05 for segregated ones. Primary populations aim for PNI of 0.67 or more. Canada chose slightly different numbers. The authors call the targets useful but subjective: they are not tied to a proven breaking point."},
  {k:"g_phases", t:"Four phases of recovery", x:"The HSRG describes four phases: Preservation (keep the population from vanishing), Recolonization (spread into reopened habitat), Local Adaptation, and Full Restoration. There are no pHOS or PNI targets in the first two. The authors warn that this lets high pHOS go on for years, and the longer it does, the harder it may be for the population to stand on its own."},
  {k:"g_status", t:"How the state's programs measure up", x:"The authors checked 24 state Chinook programs. Ignoring recovery phase, only 6 of 20 met the HSRG targets. Most of those six were small or took few parent fish compared with the size of the run. In one river, PNI was zero."},
  {k:"g_ford", t:"The Ford model", x:"The targets rest on a 2002 genetic model by Michael Ford. In every version, wild fitness falls over time when hatchery fish spawn in the wild; how fast depends on things nobody knows well. One result holds across all settings: lowering pHOS protects fitness more than raising pNOB, and doing both is best. The authors call the model a thinking tool, not a predictor."},
  {k:"g_demo", t:"A warning from the numbers model", x:"When the authors added population numbers to the Ford model, high pHOS with few wild parents led to a river dominated by hatchery spawners, with wild fitness near zero. That is hard to undo: it would take a smaller program and very low pHOS. Any early boost from a new hatchery was short-lived."},
  {k:"g_bw", t:"A second model", x:"The Baskett and Waples model follows the whole salmon life cycle. It shows the harm depends on when hatchery fish are weeded out by nature, and when crowding happens. In most realistic cases there is risk to the wild population if pHOS can't be controlled."},
  {k:"g_ctrl", t:"Controlling pHOS", x:"There are four main tools. Weirs work on some small streams but often fail on larger rivers: they cut pHOS by 35–48% on the Kalama River but only 1–12% on the Grays River, and they can delay fish and push spawning downstream. Dams with traps can work. Selective fishing has never been measured for this purpose. The last tool is releasing fewer fish."},
  {k:"g_mating", t:"Spawning to keep diversity", x:"To avoid inbreeding, hatcheries pair one male with one female, or cross several of each in a planned grid. They avoid picking favorites. Keeping family sizes even also helps. Bigger programs hold on to more genetic variety. That is the only hatchery risk that shrinks as a program grows."},
  {k:"g_size", t:"Program size", x:"The number of fish released has the \"single greatest influence\" on genetic and ecological risk. Washington's Chinook releases peaked at 200–250 million in the late 1980s and are about 170 million now. A typical conservation program releases about 212,500 fish; a typical harvest program releases 1,750,000. The studies showing benefits with little harm were all on small programs."},
  {k:"g_tools", t:"Tools for choosing a size", x:"The All-H Analyzer model explores trade-offs among habitat, harvest and hatcheries, but it covers only genetic risk and should not be used to predict exact outcomes. Another model, PCD Risk, looks at predation, competition and disease in fresh water. The authors want program size backed by real measurements of how many fish the habitat can hold, and want all the programs in a region added up together."},
  {k:"g_rear", t:"Raising fish more naturally", x:"A natural growth regime copies the river: seasonal temperatures and feeding, and fewer fish per pond. In one Chinook hatchery it cut early-maturing males from 45% to 14% and improved survival. In another, the fish were smaller and survived worse. Lower crowding helped survival but not enough to make up for raising fewer fish, so it suits small conservation programs best."},
  {k:"g_loc", t:"Where fish are released", x:"Hatcheries move fish between river basins far less than they used to, which lowers the risk of blending populations. Releasing fish downstream of wild spawning areas, or close to the estuary, means fewer hatchery fish linger and eat or crowd wild ones."},
  {k:"g_acc", t:"Acclimation ponds", x:"Young fish held in a pond near the release site learn its smell. In a ten-year Oregon steelhead study they survived 33% better and strayed 42% less. But acclimation doesn't always work for fish released in their first year, and it can't be counted on to make adults spawn in an exact stretch of river."},
  {k:"g_vol", t:"Letting fish leave on their own", x:"In a volitional release, the gate opens and fish leave when ready. Fish that aren't ready can be held back instead of lingering in the river. Results are mixed: some studies found faster migration and better survival, others no clear benefit. There are no standard rules for how to do it."},
  {k:"g_time", t:"Size and timing of release", x:"Over sixty years, Puget Sound hatcheries have released Chinook later and larger. Releasing true smolts, ready to migrate, is meant to cut contact with wild fish. But bigger is not always better: in one study, earlier, smaller fish survived better. Releasing hatchery steelhead later cut how many young wild Chinook they ate. Whether releasing smolts actually reduces competition is largely unknown."},
  {k:"g_mark", t:"Marking fish", x:"The authors call mass marking essential: without it nobody can tell hatchery fish from wild ones. The adipose fin clip is most common, used on over 95% of a release group, and can be seen at a glance. Coded-wire tags identify the exact release group but need a detector wand and lab work. Ear-bone (otolith) marks and DNA parentage tagging also work, but they don't let fishers pick out hatchery fish."},
  {k:"g_dmgmt", t:"Managing disease", x:"Washington's fish managers share a disease policy. But the medicine cabinet is small, rules on antibiotics are tightening, sick fish often stop eating medicated feed, and there are no treatments for viruses. So the focus is on prevention: clean practices, less stress, not moving fish between basins, and vaccine research. How hatchery disease affects wild fish is still uncertain."},
  {k:"g_adapt", t:"Adaptive management", x:"Washington collects a great deal of data: marks, tags, spawning surveys and counts. Yet in many cases there is no clear path from that data to a decision. The official plans for each hatchery rarely state what result would trigger a change. The authors say every program needs its own monitoring plan with risk limits and a set schedule for review."}
 ]},
 {h:"New science and conclusions", sub:"Report: Emerging science; Conclusions and recommendations, pp. 95–111", e:[
  {k:"g_new", t:"What ten more years of research showed", x:"Models and field studies since 2010 back the focus on pHOS, pNOB and PNI. Programs using 100% wild parents stayed genetically close to the wild population and showed low fitness costs. Rivers differ: hatchery steelhead in the Wenatchee River did worse for genetic reasons, while hatchery Chinook there did worse mainly because they spawned in poor habitat."},
  {k:"g_imprint", t:"Imprinting before hatching", x:"Exposing embryos to water from the place where managers want them to spawn someday is a promising new way to teach fish where home is, without building a pond there."},
  {k:"g_allh", t:"One piece of the puzzle", x:"Hatchery reform alone can't recover salmon. If the reasons a run declined, such as damaged habitat, aren't fixed, better hatchery practice won't bring it back. Expecting a quick turnaround in one or two generations is \"scientifically and logically unreasonable.\" The HSRG calls for an all-H plan: habitat, harvest, hatcheries and hydropower together."},
  {k:"g_relative", t:"Lower risk, not zero risk", x:"Reform lowers risk compared with before. It doesn't remove it. Science can't yet predict how much a given change will help. Used carelessly, models \"dangerously overstate\" how sure we are and give a false sense of security."},
  {k:"g_eff", t:"Efficiency gets in the way", x:"The measures with the best evidence, like all-wild parents and natural rearing, work in small programs. They get harder and more expensive as programs grow, and most state programs are large harvest programs built to produce as many fish as possible."},
  {k:"g_riskrisk", t:"Risk-risk trade-offs", x:"Lowering one risk often raises another. Releasing smolts instead of fry cuts competition in the river but means more time in the hatchery, and more domestication. Cutting back fishing saves wild fish from nets but lets more hatchery fish reach the spawning grounds."},
  {k:"g_context", t:"Every river is different", x:"Results depend on the habitat, the species, the history of the hatchery and the wild run, and how fishing is managed. Copying a result from one river to another without thinking about those differences can mislead."},
  {k:"g_recs", t:"The four recommendations", x:"1) Lowering pHOS and raising pNOB are sound goals and should be part of any reform. 2) Program size needs much closer scrutiny, because it affects nearly every risk. 3) The phased approach makes sense, but too many populations sit in early phases with no PNI goal; harvest programs shouldn't use it to excuse high pHOS. 4) Every program should have its own monitoring and adaptive management plan."},
  {k:"g_gaps", t:"What nobody knows yet", x:"No large, repeated experiment has tested whether hatchery reform works; nearly every big river has a hatchery, so there is little to compare against, and too little time has passed since 2009. Ecological effects could be large but are not measured, and there are no targets for them. Releasing huge pulses of same-sized fish may make ocean food webs boom and bust. And nobody adds up the combined effect of all the hatcheries in a region."}
 ]},
 {h:"Words to know", sub:"Report: Definition of terms", e:[
  {k:"g_w1", t:"Natural-origin and hatchery-origin", x:"A natural-origin fish hatched in the river, whoever its parents were. A hatchery-origin fish was spawned and raised in a hatchery. This game calls them wild and hatchery fish. Canada uses a stricter meaning of wild: the fish and both its parents must have been born in the river."},
  {k:"g_w2", t:"Broodstock and escapement", x:"Broodstock are the adult fish a hatchery keeps as parents. Escapement is the fish that escape the fisheries and make it back to spawn."},
  {k:"g_w3", t:"Smolt, fry and residual", x:"A fry is a very young salmon. A smolt is a young salmon whose body has changed to live in salt water and that is ready to migrate. A residual is a released hatchery fish that stays in the river instead of going to sea."},
  {k:"g_w4", t:"Straying", x:"Most salmon return to the stream where they grew up. A stray is one that spawns somewhere else."},
  {k:"g_w5", t:"Carrying capacity and density dependence", x:"Carrying capacity is how many fish a habitat can support. Density dependence means each fish does worse as crowding goes up."},
  {k:"g_w6", t:"Supplementation", x:"Using hatchery fish to add spawners to a wild population, hoping to raise the number of wild-born fish later."},
  {k:"g_w7", t:"Fitness", x:"How well a fish survives and reproduces in its environment. In this game it's called Wild Strength."},
  {k:"g_w8", t:"Smolt-to-adult return (SAR)", x:"The share of released smolts that survive to come back as adults. In this game it is under 1 in 100."}
 ]}
];
const GUIDE_N = GUIDE.reduce((n,s)=>n+s.e.length,0);
function openGuide(){

  openModal(`<div class="card guide" role="dialog" aria-label="Science guide"><div class="head"><h2>Science guide</h2><span class="tag l" id="gcount">${S.guide.length} of ${GUIDE_N} read</span></div>
    <p class="say">Everything in the report this game is based on, in plain words. Open a topic to read it. Each new topic is worth <b>2 XP</b>.</p>${html}
    <div class="step"><span class="muted" style="font-size:13px">Anderson et al. (2020), <i>A review of hatchery reform science in Washington State</i>, WDFW.</span><button class="btn" id="gclose">Back to the hatchery ▸</button></div></div>`);
  document.querySelectorAll("#modal details[data-g]").forEach(d=>d.addEventListener("toggle",()=>{ if(!d.open) return; const k=d.dataset.g; if(S.guide.includes(k)) return;

  $("#gclose").onclick=()=>{ closeModal(); if(S.done) return; refreshAll(); AU.setMood("map"); }; $("#modal").scrollTop=0; focus("#gclose");
}

     ${S.level<3?lock("Wild influence",3):`<div class="m"><span class="lbl">Wild influence</span><span class="v" style="color:${known&&!l.segregated?(l.PNI>=tgt(l.plan).pni?"var(--good)":"var(--hatch)"):"var(--muted)"}">${known&&!l.segregated?l.PNI.toFixed(2):"—"}</span><span class="s">${known&&!l.segregated?(l.plan.desig==="stab"?"PNI · no goal set":"PNI · goal "+tgt(l.plan).pni+"+"):"needs wild parents"}</span></div>`}
     ${S.level<5?lock("Wild strength",5):`<div class="m"><span class="lbl">Wild strength</span><span class="v">${lastLab?Math.round(lastLab.F*100):"?"}</span><span class="s">${lastLab?(lastLab===l?"measured this season":"last measured "+lastLab.cal):"fund the genetics lab"}</span></div>`}

     <dt>Wild parents</dt>${S.level<3?`<dd class="lock">Goal locked · level 3</dd>`:`<dd>Goal ${S.plan.pnob}%</dd>`}
     <dt>Genetics lab</dt>${S.level<5?`<dd class="lock">Locked · level 5</dd>`:`<dd>${S.plan.monitor?"Running":"Off"}</dd>`}

   </dl><div style="margin-top:8px;font-size:14px">Upkeep <b>${up}</b> of <b>${fund}</b> funding<div class="pips">${Array.from({length:Math.max(fund,up)},(_,i)=>`<span class="pip ${i<up?"on":""}" style="${i>=fund?"background:var(--bad);border-color:var(--bad)":""}"></span>`).join("")}</div></div></div>

   <div class="box"><div class="step"><h3>Science guide · ${(S.guide||[]).length}/${GUIDE_N}</h3><button class="btn" data-guide style="font-size:14px;padding:6px 12px">Open</button></div><span class="muted" style="font-size:13.5px">The whole report in plain words. 2 XP per topic.</span></div>
   <div class="box"><h3>Field notes · ${S.notes.length}/${NOTES.length}</h3><div class="notes">${S.notes.length?S.notes.map(k=>{const n=NOTES.find(x=>x.k===k);return `<details><summary>${n.t}</summary><p>${n.x}</p><p class="muted" style="font-size:12.5px">${n.src}</p></details>`}).join(""):`<span class="muted" style="font-size:14px">Lessons you learn go here. Each new one is worth 30 XP.</span>`}</div></div>`;

function comingHTML(){

let path=[], pending=null, keys={}, facing=false, bg=null;
const tileOf=(px,py)=>[Math.floor(px/T),Math.floor(py/T)];
function bfs(from, goalFn){
  const [sx,sy]=from, prev=new Map(), k=(x,y)=>x+","+y, q=[[sx,sy]]; prev.set(k(sx,sy),null);
  while(q.length){ const [x,y]=q.shift(); if(goalFn(x,y)){ const out=[]; let c=k(x,y); while(c){ const [a,b]=c.split(",").map(Number); out.unshift([a,b]); c=prev.get(c);} return out; }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(!walkable(nx,ny)||prev.has(k(nx,ny))) continue; prev.set(k(nx,ny),k(x,y)); q.push([nx,ny]); } }
  return null;
}
const inRect=(x,y,r)=>x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3];
const nextToRect=(x,y,r)=>inRect(x,y,[r[0]-1,r[1]-1,r[2]+2,r[3]+2]);
function walkTo(goalFn, then){
  const p=bfs(tileOf(S.pos.x,S.pos.y), goalFn); if(!p) return;
  path=p.slice(1).map(([x,y])=>({x:x*T+8,y:y*T+10})); pending=then;
  if(!path.length && then){ pending=null; then(); }
}
function goPlace(pl){ S.sign=null; walkTo((x,y)=>nextToRect(x,y,pl.r), ()=>usePlace(pl)); }
function visibleNPCs(){ return Object.keys(NPC).filter(k=>k!=="hale"||pendingFor("hale")); }
function goNPC(k){ const [nx,ny]=NPC[k].at; walkTo((x,y)=>Math.abs(x-nx)+Math.abs(y-ny)===1, ()=>talkTo(k)); }
function onCanvasClick(e){

  const npc=visibleNPCs().find(k=>{const [nx,ny]=NPC[k].at; return nx===x && (y===ny||y===ny-1);});
  if(npc) return goNPC(npc);
  const pl=PLACES.filter(p=>p.kind!=="sign").find(p=>inRect(x,y,p.r)) || PLACES.find(p=>inRect(x,y,p.r)&&!walkable(x,y));

}
function talkTo(k){

  renderPanel(); focus("#panel .choice:not([disabled]), #cont"); if(fpActive()){ const pn=$("#panel"); if(pn&&pn.getBoundingClientRect().bottom>innerHeight) pn.scrollIntoView({block:"nearest",behavior:"smooth"}); }
}
function usePlace(pl){

function nearest(){

  for(const k of visibleNPCs()){ const [nx,ny]=NPC[k].at; if(Math.abs(nx-tx)+Math.abs(ny-ty)<=1) return {type:"npc",id:k}; }
  for(const p of PLACES.filter(p=>p.kind!=="sign")) if(nextToRect(tx,ty,p.r)) return {type:"place",id:p.id};

}

document.addEventListener("keydown",e=>{
  if(!S||S.done) return;
  if(document.getElementById("modal").innerHTML){ if(modalKey) modalKey(e); return; }
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea") return;
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){

});

function loop(t){
  if(!S||S.done||!$("#cv")){ loopOn=false; return; }
  let mx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0), my=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  const sp=1.6; let moving=false;
  if(fpActive()){ moving=fpMove(t); }
  else if(mx||my){ const nx=S.pos.x+mx*sp, ny=S.pos.y+my*sp;
    if(walkable(...tileOf(nx+(mx>0?4:mx<0?-4:0),S.pos.y))) S.pos.x=nx;
    if(walkable(...tileOf(S.pos.x,ny+(my>0?4:my<0?-3:0)))) S.pos.y=ny;
    if(mx) facing=mx<0; moving=true; AU.stepTick(t); }
  else if(path.length){ const w=path[0], dx=w.x-S.pos.x, dy=w.y-S.pos.y, d=Math.hypot(dx,dy);
    if(d<=sp){ S.pos.x=w.x; S.pos.y=w.y; path.shift(); if(!path.length&&pending){ const p=pending; pending=null; p(); } }
    else { AU.stepTick(t); S.pos.x+=dx/d*sp; S.pos.y+=dy/d*sp; if(Math.abs(dx)>0.5) facing=dx<0; }
    moving=true; }
  const n=nearest(); if(JSON.stringify(n)!==JSON.stringify(near)){ near=n; if(!S.talk&&!S.sign) updateAct(); }
  if(G.eng){ if(!document.getElementById("modal").innerHTML && G.vis!==false){ draw3D(t,moving); place3DTags(); fpUI(); perf(t); } } else { const c=$("#cv").getContext("2d"); c.imageSmoothingEnabled=false; drawMap(c,t,moving); }
  requestAnimationFrame(loop);
}

    let ch=tile(x,y); const X=x*T, Y=y*T; if("rkwil".includes(ch)) ch="=";
    if(ch==="."||ch==="t"||ch==="p"){ px(X,Y,T,T,"#5fa845"); for(let i=0;i<5;i++){const a=hash(x*7+i,y*3), b=hash(x,y*11+i); px(X+Math.floor(a*14),Y+Math.floor(b*14),1,2,"#4a8f37");}
      if(hash(x,y)>0.88&&ch==="."){ px(X+5,Y+6,2,2,"#f3e16b"); px(X+10,Y+10,2,2,"#f58fb0"); } }
    if(ch==="="){ px(X,Y,T,T,"#cdbf9d"); px(X,Y+T-1,T,1,"#b3a580"); px(X+T-1,Y,1,T,"#b3a580"); if(hash(x,y)>0.5) px(X+4,Y+7,2,1,"#b8aa86"); }
    if(ch==="f"){ px(X,Y,T,T,((x+y)%2)?"#c4b08f":"#baa684"); px(X,Y,T,1,"#a9946f"); }
    if(ch==="b"){ px(X,Y,T,T,"#9b6b3d"); for(let i=0;i<4;i++) px(X,Y+i*4,T,1,"#7a5230"); px(X,Y,2,T,"#6a4526"); px(X+T-2,Y,2,T,"#6a4526"); }
    if(isWater(ch)){ px(X,Y,T,T,WATER[ch]);
      for(const [dx,dy,side] of [[0,-1,"t"],[0,1,"b"],[-1,0,"l"],[1,0,"r"]]){ const nb=tile(x+dx,y+dy);
        if(!isWater(nb) && ch!=="~" && ch!=="|"){ const col="#e4dccb"; if(side==="t")px(X,Y,T,2,col); if(side==="b")px(X,Y+T-2,T,2,col); if(side==="l")px(X,Y,2,T,col); if(side==="r")px(X+T-2,Y,2,T,col); }
        if((ch==="~"||ch==="|") && !isWater(nb) && side==="t"){ px(X,Y,T,3,"#c9b47c"); } } }
    if(ch==="l"){ px(X+3,Y+2,2,12,"#d9d2bf"); px(X+11,Y+2,2,12,"#d9d2bf"); }
    if(ch==="p"){ px(X,Y+6,T,4,"#8d99a6"); px(X,Y+6,T,1,"#b8c2cc"); if(x%3===0) px(X+7,Y+5,2,6,"#6d7884"); }
    if(ch==="t"){ px(X+2,Y+3,12,11,"#355e3b"); px(X+2,Y+3,12,2,"#4d7f55"); px(X+3,Y+8,10,1,"#2a4a2f"); }

  for(const x of [16,17]){ px(x*T+2,2,12,12,"#5d6872"); for(let k=0;k<4;k++) px(x*T+3,4+k*3,10,1,"#9fd3e8"); }

function drawFish(c,x,y,col,flip,t){ const w=Math.round(Math.sin(t/200+x)); c.fillStyle=col; if(flip){ c.fillRect(x,y+w,6,3); c.fillRect(x+6,y-1+w,2,5); } else { c.fillRect(x+2,y+w,6,3); c.fillRect(x,y-1+w,2,5);} c.fillStyle="#0b171b"; c.fillRect(flip?x+1:x+7,y+w,1,1); }

function drawMap(c,t,moving){

    if(ch==="~"||ch==="|"){ const o=T-1-Math.floor(t/40+hash(0,y)*16)%T; c.fillRect(x*T+o,y*T+Math.floor(hash(x,y)*12)+2,4,1); c.fillRect(x*T+((o+8)%T),y*T+Math.floor(hash(y,x)*12)+2,3,1); }

}

// ================= Mini-game: sorting table =================
const DESTS=[
 {k:"f",key:"1",t:"Pond 3 · Females",s:"Female parent"},
 {k:"m",key:"2",t:"Pond 3 · Males",s:"Male parent"},
 {k:"up",key:"3",t:"Back to the creek",s:"Wild fish spawn upstream"},
 {k:"carc",key:"4",t:"Carcass bins",s:"Surplus · food banks & nutrients"},
 {k:"iso",key:"5",t:"Isolation tank",s:"Sick or hurt"},
 {k:"out",key:"6",t:"Trout release",s:"Not a salmon · back to the creek"}];
function drawBigFish(cv, f, showHint){
  const c=cv.getContext("2d"), W=60, s=cv.width/W; c.imageSmoothingEnabled=false; c.clearRect(0,0,cv.width,cv.height);
  const r=rng(f.seed||1), px=(x,y,col)=>{c.fillStyle=col;c.fillRect(Math.round(x*s),Math.round(y*s),Math.ceil(s),Math.ceil(s));};
  const trout=f.o==="T", male=!trout&&f.sex==="M";
  const back=trout?"#6f7d4a":male?"#4e3f35":"#5f7a6a", side=trout?"#9aa66a":male?"#a2493a":"#b9c7c4", belly=trout?"#e6d9b8":male?"#cfa08f":"#e6ecec";
  const cx=26, cy=13, rx=trout?18:21, ry=male?7.5:(f.sex==="F"?7.5:6.5);
  for(let x=0;x<W;x++) for(let y=0;y<26;y++){
    const dx=(x-cx)/rx; if(Math.abs(dx)>1) continue;
    const top=male?cy-ry-(Math.max(0,1-Math.abs(x-cx+3)/10)*2.5):cy-ry, bot=(f.sex==="F"&&!trout)?cy+ry+Math.max(0,1-Math.abs(x-cx)/12)*1.5:cy+ry;
    const k=Math.sqrt(1-dx*dx), yt=cy-(cy-top)*k, yb=cy+(bot-cy)*k;
    if(y<yt||y>yb) continue; const rel=(y-yt)/(yb-yt);
    px(x,y, rel<0.35?back:rel<0.7?side:belly);
  }
  for(let i=0;i<9;i++){ for(let y=cy-2-i*0.9;y<=cy+2+i*0.9;y++) px(cx+rx-1+i,y,back); }
  for(let i=0;i<6;i++) for(let j=0;j<4-Math.abs(i-2)*0.8;j++) px(cx-6+i,cy-ry-(male?3:1)-j,back);
  const ax=cx+rx-7, ay=cy-ry*0.62-1;
  if(!f.clipped){ px(ax,ay,back); px(ax+1,ay,back); px(ax+1,ay-1,back); px(ax,ay-1,back); }
  else { px(ax,ay+1,"#e8c9b9"); px(ax+1,ay+1,"#e8c9b9"); }
  px(cx-rx+5,cy-2,"#111"); px(cx-rx+6,cy-2,"#f4f4f4");
  if(male){ px(cx-rx+1,cy+1,"#4e3f35"); px(cx-rx,cy+1,"#4e3f35"); px(cx-rx,cy,"#4e3f35"); px(cx-rx-1,cy-1,"#4e3f35"); px(cx-rx+2,cy+2,"#4e3f35"); }
  if(trout){ for(let i=0;i<28;i++) px(cx-rx+4+r()*(rx*2),cy-ry+1+r()*ry*1.4,"#2b2b22"); for(let x=cx-rx+4;x<cx+rx-2;x++) px(x,cy,"#d97b8f"); }
  if(f.sick){ for(let i=0;i<5;i++){ const sx=cx-8+r()*18, sy=cy-3+r()*6; px(sx,sy,"#f2f2ea"); px(sx+1,sy,"#f2f2ea"); px(sx,sy+1,"#e2e2d6"); } }
  if(showHint){ c.strokeStyle="#ecc65e"; c.lineWidth=Math.max(2,s/2); c.beginPath(); c.arc((ax+1)*s,ay*s,s*3.2,0,Math.PI*2); c.stroke(); }
}
function judge(f,d,st){
  const known=S.plan.mark, pf=st.pondF.length, pm=st.pondM.length, need=S.cur.needPairs;
  if(f.o==="T") return d==="out"?["good","Right. Trout aren't part of this program. Back to the creek it goes."]:["bad","That was a trout (spots, pink stripe). It goes back to the creek with the trout release."];
  if(f.sick) return d==="iso"?["good","Good eye. Sick fish go to isolation so disease doesn't spread."]:["bad","See the white patches? That fish was sick. It belonged in isolation."];
  if(d==="iso") return ["meh","Isolation is for sick or hurt fish. This one looked healthy."];
  if(d==="out") return ["bad","Trout release is for trout. This was a salmon."];
  if(d==="f"||d==="m"){
    if((d==="f")!==(f.sex==="F")) return ["bad", f.sex==="M"?"That was a male: hooked jaw, hump, darker color. It can't spawn as a female.":"That was a female: rounder belly, no hooked jaw."];
    if((d==="f"?pf:pm)>need) return ["meh","You already had enough parents of that sex. Extra parents are fish that won't spawn in the river."];
    if(!known) return ["meh","Good pick on sex. Without fin clips, though, you can't tell whether you kept a wild or a hatchery parent."];
    const wantW=S.plan.pnob/100, keptW=st.log.filter(x=>(x.d==="f"||x.d==="m")&&x.o==="W").length-(f.o==="W"?1:0), kept=pf+pm-1;
    if(S.level>=3 && S.plan.pnob>0 && f.o==="H" && keptW/(kept||1)<wantW-0.01) return ["meh","Okay, but your wild-parent goal wants more unclipped fish in the ponds."];
    return ["good", f.o==="W"?"A wild parent. It keeps the hatchery line tied to the river.":"A hatchery parent for the next generation."];
  }
  if(d==="up"&&f.dit) return ["bad", st.scanned?"The T-wand beeped: that fish carried a coded-wire tag, so it was a hatchery fish. Sending it upstream adds a hatchery spawner.":"That fish kept its fin, but it carried a hidden coded-wire tag: it was a hatchery fish. Scan unclipped fish with the T-wand to catch these."];
  if(d==="carc"&&f.dit) return ["good","Right. No fin clip, but the T-wand found a tag: a hatchery fish. Its snout goes to the lab so the tag can be read."];
  if(d==="up"){
    if(!known) return ["meh","Without fin clips you can't know. If this was a hatchery fish, it'll spawn in the river."];
    return f.o==="W"?["good","Wild fish go back upstream to spawn. That grows the wild run."]:["bad","That fish had a clipped fin. Sending it upstream adds a hatchery spawner to the river."];
  }
  if(d==="carc"){
    if(!known) return ["meh","Without fin clips you can't know. If this was a wild fish, it won't get to spawn."];
    return f.o==="H"?["good","Surplus hatchery fish go to food banks or back to streams as nutrients."]:["bad","That fish still had its adipose fin. It was wild. Wild fish you don't need go back to the creek."];
  }
  return ["meh",""];
}
let sortState=null, timerId=null;
function openSort(){ AU.setMood("sort");
  if(!S.cur) computeRun();
  sortState={i:0,pondF:[],pondM:[],iso:0,rec:0,log:[],score:0,time:90,last:null,done:false};
  renderSort(); clearInterval(timerId);
  timerId=setInterval(()=>{ if(!sortState||sortState.done){clearInterval(timerId);return;} sortState.time--; if(sortState.time<=10&&sortState.time>0) AU.sfx("tick"); const el=$("#timer"); if(el) el.textContent=sortState.time+"s"; if(sortState.time<=0){ clearInterval(timerId); endSort(false); } },1000);
}
function renderSort(word){
  const st=sortState, f=S.cur.fish[st.i], need=S.cur.needPairs, known=S.plan.mark, showWild=S.level>=3&&known&&S.plan.pnob>0;
  const keptW=st.log.filter(x=>(x.d==="f"||x.d==="m")&&x.o==="W").length, kept=st.pondF.length+st.pondM.length;
  openModal(`<div class="card" role="dialog" aria-label="Mark check and sorting">
    <div class="head"><h2>Mark check & sorting</h2><span class="timer" id="timer">${st.time}s</span></div>
    <p class="muted">Fish ${Math.min(st.i+1,S.cur.fish.length)} of ${S.cur.fish.length}. Each salmon here stands for about ${fmt(S.cur.avg)} real fish in this year's run. Any fish left when time runs out goes upstream.</p>
    <div class="goals">
      <span class="goal">Females kept <b>${st.pondF.length}/${need}</b></span>
      <span class="goal">Males kept <b>${st.pondM.length}/${need}</b></span>
      ${showWild?`<span class="goal">Wild parents <b>${keptW}/${kept}</b> · goal ${S.plan.pnob}%</span>`:""}
      ${!known?`<span class="goal" style="color:var(--hatch)">No fin clips: you can't tell wild from hatchery</span>`:""}
    </div>
    ${f?`<div class="table" id="tbl">${initAux()?`<div class="fishview" id="fishview" role="img" aria-label="${fishDesc(f)}"></div>`:`<canvas id="bigfish" width="480" height="208" aria-label="${fishDesc(f)}"></canvas>`}
      <div class="wandrow"><button class="btn ghost" id="wand">Scan with the T-wand <kbd>W</kbd></button><span class="scanline ${st.scanned?(f.tag?"hit":"miss"):"idle"}" id="wandout">${st.scanned?(f.tag?"BEEP! Coded-wire tag found → hatchery fish":"No tag detected"):"T-wand: not scanned yet"}</span></div>
      ${S.year<2?`<span class="tip">${known?"No little fin near the tail (circled) = hatchery. Fin there? Scan the snout with the T-wand: a beep means a hidden hatchery tag. ":""}Males: hooked jaw and hump. Females: round belly. Sick: white patches. Trout: spots.</span>`:""}
      ${word?`<div class="pop" style="color:${word[1]}">${word[0]}</div>`:""}
    </div>
    <div class="dests">${DESTS.map(d=>`<button class="dest" data-d="${d.k}"><b>${d.t}</b><span>${d.s}</span><kbd>${d.key}</kbd></button>`).join("")}</div>`:""}
    <div class="feedback ${st.last?st.last[0]:""}" aria-live="polite">${st.last?"Last fish: "+st.last[1]:"Look at each fish, then pick where it goes. Need parents? Keep one female and one male for each pair."}</div>
    <div class="step"><button class="btn ghost" id="crew" ${S.year<2?"disabled":""}>${S.year>=2?"Let the crew sort the rest":"Crew help unlocks in season 3"}</button><span class="muted">Keys <kbd>1</kbd>–<kbd>6</kbd></span></div>
  </div>`);
  if(f){ if(!startFishView(f)){ const bf=$("#bigfish"); if(bf) drawBigFish(bf,f,known&&S.year<2&&f.o!=="T"); } document.querySelectorAll(".dest").forEach(b=>b.onclick=()=>sortFish(b.dataset.d)); }
  $("#crew").onclick=crewSort; const wb=$("#wand"); if(wb) wb.onclick=()=>scanWand();
  modalKey=e=>{ if((e.key==='w'||e.key==='W')&&f){ e.preventDefault(); scanWand(); return; } const d=DESTS.find(x=>x.key===e.key); if(d&&f){ e.preventDefault(); sortFish(d.k);} };
}
function scanWand(){ const st=sortState; if(!st||st.done||st.scanning||st.scanned) return; const f=S.cur.fish[st.i]; if(!f) return; st.scanning=true; window.__wandT=performance.now(); window.__wandHit=!!f.tag; AU.sfx("wand");
  const o=$("#wandout"); if(o){ o.textContent="Scanning…"; o.className="scanline idle"; }
  setTimeout(()=>{ if(sortState!==st||st.done) return; st.scanning=false; st.scanned=true; st.scans=(st.scans||0)+1; AU.sfx(f.tag?"beep":"notag"); const o2=$("#wandout"); if(o2){ o2.textContent=f.tag?"BEEP! Coded-wire tag found → hatchery fish":"No tag detected"; o2.className="scanline "+(f.tag?"hit":"miss"); } },650); }
function fishDesc(f){ if(f.o==="T") return "A spotted trout with a pink stripe"; return `A ${f.sex==="M"?"male salmon with a hooked jaw":"female salmon with a round belly"}${S.plan.mark?(f.clipped?", adipose fin clipped":", adipose fin present"):""}${f.sick?", with white patches of disease":""}`; }
function applySort(f,d){
  const st=sortState;
  if(d==="f") st.pondF.push(f.o); else if(d==="m") st.pondM.push(f.o); else if(d==="iso") st.iso++; else if(d==="up"&&f.o==="W") st.rec++;
  st.log.push({o:f.o,sex:f.sex,sick:f.sick,d,trout:f.o==="T"});
}
function sortFish(d){
  const st=sortState; if(st.done) return; const f=S.cur.fish[st.i];
  applySort(f,d); const j=judge(f,d,st); AU.sfx(j[0]); if(d==="up"||d==="out") AU.sfx("splash",0.15); st.scanned=false; st.scanning=false; st.last=j; st.score+=j[0]==="good"?1:j[0]==="meh"?0.5:0; st.i++;
  if(st.i>=S.cur.fish.length){ endSort(false); return; }
  const word=j[0]==="good"?[["Great!","Nice!","Perfect!"][st.i%3],"var(--good)"]:j[0]==="meh"?["Hmm…","var(--gold)"]:["Oops!","var(--bad)"];
  renderSort(word);
}
function crewSort(){
  const st=sortState, need=S.cur.needPairs, known=S.plan.mark, wantWild=Math.round(S.plan.pnob/100*need);
  while(st.i<S.cur.fish.length){ const f=S.cur.fish[st.i]; let d;
    if(f.o==="T") d="out"; else if(f.sick) d="iso";
    else { const pond=f.sex==="F"?st.pondF:st.pondM, room=need-pond.length, P=f.sex==="F"?"f":"m";
      if(!known) d = room>0 ? P : "up";
      else { const wildIn=pond.filter(o=>o==="W").length, hatchIn=pond.length-wildIn;
        if(room>0 && f.o==="W" && (wildIn<wantWild || hatchIn>=need-wantWild)) d=P;
        else if(room>0 && f.o==="H" && hatchIn<need-wantWild) d=P;
        else d = f.o==="W"?"up":"carc"; } }
    applySort(f,d); st.score+=0.5; st.i++; }
  st.crew=true; endSort(true);
